name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg fonts-dejavu-core

      - name: Restore
        run: dotnet restore ListingStudio.slnx

      - name: Build
        run: dotnet build ListingStudio.slnx --no-restore

      - name: Test
        run: dotnet test ListingStudio.slnx --no-build --logger "console;verbosity=normal"
        env:
          RUN_FFMPEG_E2E: "1"
