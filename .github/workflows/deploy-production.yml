name: Deploy production

# Production releases are intentionally started manually and protected by the
# GitHub production environment so every deployment has an auditable reason.

on:
  workflow_dispatch:
    inputs:
      release_reason:
        description: Auditable reason for this production deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: listing-studio-production
  cancel-in-progress: false

jobs:
  verify:
    name: Restore, build, test and publish
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg fonts-dejavu-core

      - name: Restore
        run: dotnet restore ListingStudio.slnx

      - name: Build
        run: dotnet build ListingStudio.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ListingStudio.slnx --configuration Release --no-build --logger "console;verbosity=normal"
        env:
          RUN_FFMPEG_E2E: "1"

      - name: Publish Web
        run: dotnet publish src/ListingStudio.Web/ListingStudio.Web.csproj --configuration Release --no-build --output artifacts/web

      - name: Publish Worker
        run: dotnet publish src/ListingStudio.Worker/ListingStudio.Worker.csproj --configuration Release --no-build --output artifacts/worker

      - name: Validate Bicep
        run: >-
          docker run --rm
          -v "${{ github.workspace }}:/workspace"
          -w /workspace
          mcr.microsoft.com/azure-cli:2.77.0
          az bicep build --file infra/main.bicep --stdout > /dev/null

  deploy:
    name: Containerize, migrate and deploy
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      AZURE_NAME_PREFIX: ${{ vars.AZURE_NAME_PREFIX }}
      POSTGRES_ADMIN_LOGIN: ${{ vars.POSTGRES_ADMIN_LOGIN }}
      POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      GOOGLE_AUTH_CLIENT_ID: ${{ vars.GOOGLE_AUTH_CLIENT_ID }}
      GOOGLE_AUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_AUTH_CLIENT_SECRET }}
      GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
      HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
      HIGGSFIELD_API_SECRET: ${{ secrets.HIGGSFIELD_API_SECRET }}
      # Optional: with this secret set, campaign narration uses ElevenLabs instead of OpenAI.
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      VOICE_PROVIDER: ${{ secrets.ELEVENLABS_API_KEY != '' && 'ElevenLabs' || 'OpenAI' }}
      OPENAI_MEDIA_ANALYSIS_ESTIMATED_COST_USD: ${{ vars.OPENAI_MEDIA_ANALYSIS_ESTIMATED_COST_USD || '0' }}
      OPENAI_STORY_ESTIMATED_COST_USD: ${{ vars.OPENAI_STORY_ESTIMATED_COST_USD || '0' }}
      OPENAI_VIDEO_DIRECTION_ESTIMATED_COST_USD: ${{ vars.OPENAI_VIDEO_DIRECTION_ESTIMATED_COST_USD || '0' }}
      OPENAI_SPEECH_ESTIMATED_COST_USD: ${{ vars.OPENAI_SPEECH_ESTIMATED_COST_USD || '0' }}
      VOICE_ESTIMATED_COST_USD: ${{ vars.VOICE_ESTIMATED_COST_USD || '0' }}
      PHOTO_FIX_ESTIMATED_COST_USD: ${{ vars.PHOTO_FIX_ESTIMATED_COST_USD || '0' }}
      AGENT_PORTRAIT_ESTIMATED_COST_USD: ${{ vars.AGENT_PORTRAIT_ESTIMATED_COST_USD || '0' }}
      AGENT_PORTRAIT_ENHANCEMENT_ENABLED: ${{ vars.AGENT_PORTRAIT_ENHANCEMENT_ENABLED || 'true' }}
      AI_VIDEO_ESTIMATED_COST_USD: ${{ vars.AI_VIDEO_ESTIMATED_COST_USD || '0' }}
      HIGGSFIELD_ESTIMATED_COST_PER_CALL_USD: ${{ vars.HIGGSFIELD_ESTIMATED_COST_PER_CALL_USD || '0' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify protected deployment configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            AZURE_RESOURCE_GROUP AZURE_LOCATION AZURE_NAME_PREFIX
            POSTGRES_ADMIN_LOGIN POSTGRES_ADMIN_PASSWORD
            OPENAI_API_KEY OPENAI_MODEL
            GOOGLE_AUTH_CLIENT_ID GOOGLE_AUTH_CLIENT_SECRET GOOGLE_PLACES_API_KEY
            HIGGSFIELD_API_KEY HIGGSFIELD_API_SECRET
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required production environment value is missing: ${name}" >&2
              exit 1
            fi
          done
          pricing_values=(
            OPENAI_MEDIA_ANALYSIS_ESTIMATED_COST_USD
            OPENAI_STORY_ESTIMATED_COST_USD
            OPENAI_VIDEO_DIRECTION_ESTIMATED_COST_USD
            OPENAI_SPEECH_ESTIMATED_COST_USD
            VOICE_ESTIMATED_COST_USD
            PHOTO_FIX_ESTIMATED_COST_USD
            AGENT_PORTRAIT_ESTIMATED_COST_USD
            AI_VIDEO_ESTIMATED_COST_USD
            HIGGSFIELD_ESTIMATED_COST_PER_CALL_USD
          )
          for name in "${pricing_values[@]}"; do
            if [[ ! "${!name}" =~ ^[0-9]+([.][0-9]+)?$ ]]; then
              echo "Production pricing value must be a nonnegative decimal: ${name}" >&2
              exit 1
            fi
          done

      - name: Sign in to Azure using GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Provision production foundation
        id: foundation
        shell: bash
        run: |
          set -euo pipefail
          az group create \
            --name "$AZURE_RESOURCE_GROUP" \
            --location "$AZURE_LOCATION" \
            --tags application=listing-studio environment=production managedBy=github-actions \
            --output none
          outputs=$(az deployment group create \
            --name "listing-studio-foundation-${GITHUB_RUN_NUMBER}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              namePrefix="$AZURE_NAME_PREFIX" \
              location="$AZURE_LOCATION" \
              postgresAdministratorLogin="$POSTGRES_ADMIN_LOGIN" \
              postgresAdministratorPassword="$POSTGRES_ADMIN_PASSWORD" \
              openAiApiKey="$OPENAI_API_KEY" \
              openAiModel="$OPENAI_MODEL" \
              openAiMediaAnalysisEstimatedCostUsd="$OPENAI_MEDIA_ANALYSIS_ESTIMATED_COST_USD" \
              openAiStoryEstimatedCostUsd="$OPENAI_STORY_ESTIMATED_COST_USD" \
              openAiVideoDirectionEstimatedCostUsd="$OPENAI_VIDEO_DIRECTION_ESTIMATED_COST_USD" \
              openAiSpeechEstimatedCostUsd="$OPENAI_SPEECH_ESTIMATED_COST_USD" \
              voiceEstimatedCostUsd="$VOICE_ESTIMATED_COST_USD" \
              photoFixEstimatedCostUsd="$PHOTO_FIX_ESTIMATED_COST_USD" \
              agentPortraitEstimatedCostUsd="$AGENT_PORTRAIT_ESTIMATED_COST_USD" \
              aiVideoEstimatedCostUsd="$AI_VIDEO_ESTIMATED_COST_USD" \
              higgsfieldEstimatedCostPerCallUsd="$HIGGSFIELD_ESTIMATED_COST_PER_CALL_USD" \
              mediaAnalysisEnabled=true \
              googleAuthenticationEnabled=true \
              googleAuthenticationClientId="$GOOGLE_AUTH_CLIENT_ID" \
              googleAuthenticationClientSecret="$GOOGLE_AUTH_CLIENT_SECRET" \
              neighborhoodInsightsEnabled=true \
              googlePlacesApiKey="$GOOGLE_PLACES_API_KEY" \
              higgsfieldEnabled=true \
              photoClutterRemovalEnabled=true \
              agentPortraitEnhancementEnabled="$AGENT_PORTRAIT_ENHANCEMENT_ENABLED" \
              higgsfieldApiKey="$HIGGSFIELD_API_KEY" \
              higgsfieldApiSecret="$HIGGSFIELD_API_SECRET" \
              voiceProvider="$VOICE_PROVIDER" \
              elevenLabsApiKey="$ELEVENLABS_API_KEY" \
              deployApplications=false \
            --query properties.outputs \
            --output json)
          acr_name=$(jq -r '.acrName.value' <<<"$outputs")
          acr_login_server=$(jq -r '.acrLoginServer.value' <<<"$outputs")
          echo "acr_name=$acr_name" >> "$GITHUB_OUTPUT"
          echo "acr_login_server=$acr_login_server" >> "$GITHUB_OUTPUT"

      - name: Refresh Azure OIDC session before registry login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push immutable images
        shell: bash
        env:
          ACR_NAME: ${{ steps.foundation.outputs.acr_name }}
          ACR_LOGIN_SERVER: ${{ steps.foundation.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          az acr login --name "$ACR_NAME"
          docker buildx build --platform linux/amd64 --file Dockerfile.web \
            --tag "$ACR_LOGIN_SERVER/listingstudio-web:$GITHUB_SHA" --push .
          docker buildx build --platform linux/amd64 --file Dockerfile.worker \
            --tag "$ACR_LOGIN_SERVER/listingstudio-worker:$GITHUB_SHA" --push .
          docker buildx build --platform linux/amd64 --file Dockerfile.migrations \
            --tag "$ACR_LOGIN_SERVER/listingstudio-migrations:$GITHUB_SHA" --push .

      - name: Deploy immutable revisions and migration job
        id: applications
        shell: bash
        env:
          ACR_LOGIN_SERVER: ${{ steps.foundation.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          outputs=$(az deployment group create \
            --name "listing-studio-apps-${GITHUB_RUN_NUMBER}" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --template-file infra/main.bicep \
            --parameters \
              namePrefix="$AZURE_NAME_PREFIX" \
              location="$AZURE_LOCATION" \
              postgresAdministratorLogin="$POSTGRES_ADMIN_LOGIN" \
              postgresAdministratorPassword="$POSTGRES_ADMIN_PASSWORD" \
              openAiApiKey="$OPENAI_API_KEY" \
              openAiModel="$OPENAI_MODEL" \
              openAiMediaAnalysisEstimatedCostUsd="$OPENAI_MEDIA_ANALYSIS_ESTIMATED_COST_USD" \
              openAiStoryEstimatedCostUsd="$OPENAI_STORY_ESTIMATED_COST_USD" \
              openAiVideoDirectionEstimatedCostUsd="$OPENAI_VIDEO_DIRECTION_ESTIMATED_COST_USD" \
              openAiSpeechEstimatedCostUsd="$OPENAI_SPEECH_ESTIMATED_COST_USD" \
              voiceEstimatedCostUsd="$VOICE_ESTIMATED_COST_USD" \
              photoFixEstimatedCostUsd="$PHOTO_FIX_ESTIMATED_COST_USD" \
              agentPortraitEstimatedCostUsd="$AGENT_PORTRAIT_ESTIMATED_COST_USD" \
              aiVideoEstimatedCostUsd="$AI_VIDEO_ESTIMATED_COST_USD" \
              higgsfieldEstimatedCostPerCallUsd="$HIGGSFIELD_ESTIMATED_COST_PER_CALL_USD" \
              mediaAnalysisEnabled=true \
              googleAuthenticationEnabled=true \
              googleAuthenticationClientId="$GOOGLE_AUTH_CLIENT_ID" \
              googleAuthenticationClientSecret="$GOOGLE_AUTH_CLIENT_SECRET" \
              neighborhoodInsightsEnabled=true \
              googlePlacesApiKey="$GOOGLE_PLACES_API_KEY" \
              higgsfieldEnabled=true \
              photoClutterRemovalEnabled=true \
              agentPortraitEnhancementEnabled="$AGENT_PORTRAIT_ENHANCEMENT_ENABLED" \
              higgsfieldApiKey="$HIGGSFIELD_API_KEY" \
              higgsfieldApiSecret="$HIGGSFIELD_API_SECRET" \
              voiceProvider="$VOICE_PROVIDER" \
              elevenLabsApiKey="$ELEVENLABS_API_KEY" \
              deployApplications=true \
              webImage="$ACR_LOGIN_SERVER/listingstudio-web:$GITHUB_SHA" \
              workerImage="$ACR_LOGIN_SERVER/listingstudio-worker:$GITHUB_SHA" \
              migrationImage="$ACR_LOGIN_SERVER/listingstudio-migrations:$GITHUB_SHA" \
            --query properties.outputs \
            --output json)
          {
            echo "migration_job=$(jq -r '.migrationJobName.value' <<<"$outputs")"
            echo "web_app=$(jq -r '.webAppName.value' <<<"$outputs")"
            echo "web_url=$(jq -r '.webUrl.value' <<<"$outputs")"
            echo "worker_app=$(jq -r '.workerAppName.value' <<<"$outputs")"
          } >> "$GITHUB_OUTPUT"

      - name: Apply database migrations exactly once
        shell: bash
        env:
          MIGRATION_JOB: ${{ steps.applications.outputs.migration_job }}
        run: |
          set -euo pipefail
          execution=$(az containerapp job start \
            --name "$MIGRATION_JOB" \
            --resource-group "$AZURE_RESOURCE_GROUP" \
            --query name \
            --output tsv)
          for _ in {1..60}; do
            status=$(az containerapp job execution show \
              --name "$MIGRATION_JOB" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --job-execution-name "$execution" \
              --query properties.status \
              --output tsv)
            case "$status" in
              Succeeded)
                echo "Migration execution succeeded: $execution"
                exit 0
                ;;
              Failed|Stopped|Degraded)
                echo "Migration execution failed with status: $status" >&2
                exit 1
                ;;
            esac
            sleep 10
          done
          echo "Migration execution timed out: $execution" >&2
          exit 1

      - name: Enable worker after migrations
        shell: bash
        env:
          WORKER_APP: ${{ steps.applications.outputs.worker_app }}
        run: >-
          az containerapp update
          --name "$WORKER_APP"
          --resource-group "$AZURE_RESOURCE_GROUP"
          --min-replicas 1
          --max-replicas 1
          --output none

      - name: Verify public Web readiness
        shell: bash
        env:
          WEB_URL: ${{ steps.applications.outputs.web_url }}
        run: curl --fail --show-error --silent --retry 12 --retry-delay 10 --retry-all-errors "$WEB_URL/health/ready"

      - name: Verify worker revision health
        shell: bash
        env:
          WORKER_APP: ${{ steps.applications.outputs.worker_app }}
        run: |
          set -euo pipefail
          for _ in {1..30}; do
            health=$(az containerapp revision list \
              --name "$WORKER_APP" \
              --resource-group "$AZURE_RESOURCE_GROUP" \
              --query "[?properties.active].properties.healthState | [0]" \
              --output tsv)
            if [[ "$health" == "Healthy" ]]; then
              exit 0
            fi
            if [[ "$health" == "Unhealthy" ]]; then
              echo "Worker revision is unhealthy." >&2
              exit 1
            fi
            sleep 10
          done
          echo "Worker revision did not become healthy in time." >&2
          exit 1

      - name: Write deployment summary
        shell: bash
        env:
          RELEASE_REASON: ${{ inputs.release_reason }}
          WEB_URL: ${{ steps.applications.outputs.web_url }}
        run: |
          {
            echo "## Production deployment"
            echo "- Commit: \`$GITHUB_SHA\`"
            echo "- Web: $WEB_URL"
            echo "- Reason: $RELEASE_REASON"
            echo "- Database migration job: succeeded"
            echo "- Web readiness: passed"
            echo "- Worker health: passed"
          } >> "$GITHUB_STEP_SUMMARY"
